name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipk:
    name: Build ipk + opkg feed index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ "${ref#v}" != "${ref}" ]; then
            version="${ref#v}"
          else
            version="0.0.0"
          fi
          if ! printf '%s' "${version}" | grep -Eq '^[0-9][0-9A-Za-z._~+-]*$'; then
            echo "::error::Ref '${ref}' cannot be used as a package version; tag as vX.Y.Z."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building version: ${version}"

      - name: Install build dependencies
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            build-essential bison curl file flex gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-venv \
            rsync unzip wget xz-utils zlib1g-dev zstd

      - name: Resolve OpenWrt SDK
        id: sdk
        env:
          SDK_BASE_URL: https://downloads.openwrt.org/releases/24.10.0/targets/x86/64
          SDK_PATTERN: openwrt-sdk-24.10.0-x86-64_.*Linux-x86_64\.tar\.(xz|zst)
        run: |
          line="$(curl -fsSL "${SDK_BASE_URL}/sha256sums" | grep -E "[[:space:]]+\*?${SDK_PATTERN}$" | head -n1)"
          if [ -z "${line}" ]; then
            echo "::error::No SDK matching '${SDK_PATTERN}' at ${SDK_BASE_URL}."
            exit 1
          fi
          file="$(printf '%s\n' "${line}" | awk '{print $2}' | sed 's/^\*//')"
          sha="$(printf '%s\n' "${line}" | awk '{print $1}')"
          echo "file=${file}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "cache_key=openwrt-sdk-ipk-${sha}" >> "${GITHUB_OUTPUT}"

      - name: Cache SDK archive
        uses: actions/cache@v4
        with:
          path: .cache/openwrt-sdk/${{ steps.sdk.outputs.file }}
          key: ${{ steps.sdk.outputs.cache_key }}

      - name: Download and extract SDK
        env:
          SDK_FILE: ${{ steps.sdk.outputs.file }}
          SDK_SHA: ${{ steps.sdk.outputs.sha }}
        run: |
          mkdir -p .cache/openwrt-sdk sdk
          if [ ! -f ".cache/openwrt-sdk/${SDK_FILE}" ]; then
            curl -fL "https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/${SDK_FILE}" \
              -o ".cache/openwrt-sdk/${SDK_FILE}"
          fi
          printf '%s  %s\n' "${SDK_SHA}" ".cache/openwrt-sdk/${SDK_FILE}" | sha256sum -c -
          case "${SDK_FILE}" in
            *.tar.zst) tar --zstd -xf ".cache/openwrt-sdk/${SDK_FILE}" -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf  ".cache/openwrt-sdk/${SDK_FILE}" -C sdk --strip-components=1 ;;
            *) echo "::error::Unsupported SDK archive: ${SDK_FILE}"; exit 1 ;;
          esac

      - name: Prepare OpenWrt feeds
        working-directory: sdk
        run: |
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Stage this package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p sdk/package
          rsync -a --delete \
            --exclude='.git' --exclude='sdk' --exclude='llm' --exclude='preview' \
            ./ sdk/package/luci-theme-c2/
          sed -i -E "s/^(PKG_VERSION):=.*/\1:=${VERSION}/" sdk/package/luci-theme-c2/Makefile
          sed -i -E "s/^(PKG_RELEASE):=.*/\1:=1/" sdk/package/luci-theme-c2/Makefile

      - name: Configure
        working-directory: sdk
        run: |
          cat > .config <<'EOF'
          CONFIG_ALL=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          CONFIG_AUTOREMOVE=n
          CONFIG_PACKAGE_luci-theme-c2=m
          EOF
          sed -i 's/^[[:space:]]*//' .config
          make defconfig

      - name: Compile
        working-directory: sdk
        run: make package/luci-theme-c2/compile -j"$(nproc)" V=s

      - name: Build opkg feed index
        run: |
          mkdir -p feed
          find sdk/bin/packages -type f -name 'luci-theme-c2_*.ipk' -exec cp -v {} feed/ \;
          if [ -z "$(ls -A feed)" ]; then
            echo "::error::No ipk produced."
            find sdk/bin/packages -maxdepth 3 -type f | sort
            exit 1
          fi
          cd feed
          mkhash_bin="../sdk/staging_dir/host/bin/mkhash"
          if [ ! -x "${mkhash_bin}" ]; then
            mkhash_bin="${PWD}/mkhash"
            cat > "${mkhash_bin}" <<'SH'
          #!/bin/sh
          algo="$1"; shift
          case "$algo" in
            sha256) sha256sum "$@" | awk '{print $1}' ;;
            md5) md5sum "$@" | awk '{print $1}' ;;
            *) echo "unsupported algo: $algo" >&2; exit 1 ;;
          esac
          SH
            chmod +x "${mkhash_bin}"
          fi
          MKHASH="${mkhash_bin}" bash ../sdk/scripts/ipkg-make-index.sh . > Packages
          gzip -9n -k Packages
          echo "--- feed contents ---"
          ls -l
          echo "--- Packages ---"
          cat Packages

      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipk-feed
          path: feed/*
          if-no-files-found: error

  build-apk:
    name: Build apk (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          version="${ref#v}"
          printf '%s' "${version}" | grep -Eq '^[0-9][0-9A-Za-z._~+-]*$' || version="0.0.0"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install build dependencies
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            build-essential bison curl file flex gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-venv \
            rsync unzip wget xz-utils zlib1g-dev zstd

      - name: Resolve OpenWrt SDK
        id: sdk
        env:
          SDK_BASE_URL: https://downloads.openwrt.org/snapshots/targets/x86/64
          SDK_PATTERN: openwrt-sdk-x86-64_.*Linux-x86_64\.tar\.zst
        run: |
          line="$(curl -fsSL "${SDK_BASE_URL}/sha256sums" | grep -E "[[:space:]]+\*?${SDK_PATTERN}$" | head -n1)"
          if [ -z "${line}" ]; then
            echo "::error::No SDK matching '${SDK_PATTERN}' at ${SDK_BASE_URL}."
            exit 1
          fi
          file="$(printf '%s\n' "${line}" | awk '{print $2}' | sed 's/^\*//')"
          sha="$(printf '%s\n' "${line}" | awk '{print $1}')"
          echo "file=${file}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "cache_key=openwrt-sdk-apk-${sha}" >> "${GITHUB_OUTPUT}"

      - name: Cache SDK archive
        uses: actions/cache@v4
        with:
          path: .cache/openwrt-sdk/${{ steps.sdk.outputs.file }}
          key: ${{ steps.sdk.outputs.cache_key }}

      - name: Download and extract SDK
        env:
          SDK_FILE: ${{ steps.sdk.outputs.file }}
          SDK_SHA: ${{ steps.sdk.outputs.sha }}
        run: |
          mkdir -p .cache/openwrt-sdk sdk
          if [ ! -f ".cache/openwrt-sdk/${SDK_FILE}" ]; then
            curl -fL "https://downloads.openwrt.org/snapshots/targets/x86/64/${SDK_FILE}" \
              -o ".cache/openwrt-sdk/${SDK_FILE}"
          fi
          printf '%s  %s\n' "${SDK_SHA}" ".cache/openwrt-sdk/${SDK_FILE}" | sha256sum -c -
          case "${SDK_FILE}" in
            *.tar.zst) tar --zstd -xf ".cache/openwrt-sdk/${SDK_FILE}" -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf  ".cache/openwrt-sdk/${SDK_FILE}" -C sdk --strip-components=1 ;;
            *) echo "::error::Unsupported SDK archive: ${SDK_FILE}"; exit 1 ;;
          esac

      - name: Prepare OpenWrt feeds
        working-directory: sdk
        run: |
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Stage this package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p sdk/package
          rsync -a --delete \
            --exclude='.git' --exclude='sdk' --exclude='llm' --exclude='preview' \
            ./ sdk/package/luci-theme-c2/
          sed -i -E "s/^(PKG_VERSION):=.*/\1:=${VERSION}/" sdk/package/luci-theme-c2/Makefile
          sed -i -E "s/^(PKG_RELEASE):=.*/\1:=1/" sdk/package/luci-theme-c2/Makefile

      - name: Configure
        working-directory: sdk
        run: |
          cat > .config <<'EOF'
          CONFIG_ALL=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          CONFIG_AUTOREMOVE=n
          CONFIG_PACKAGE_luci-theme-c2=m
          EOF
          sed -i 's/^[[:space:]]*//' .config
          make defconfig

      - name: Compile
        working-directory: sdk
        run: make package/luci-theme-c2/compile -j"$(nproc)" V=s

      - name: Collect apk
        run: |
          mkdir -p apk
          find sdk/bin/packages -type f -name 'luci-theme-c2-*.apk' -exec cp -v {} apk/ \;
          test -n "$(ls -A apk)"

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-package
          path: apk/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ipk, build-apk]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build-ipk.result == 'success' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true

      - name: List release assets
        run: ls -l release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

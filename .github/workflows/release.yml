name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipk:
    name: Build ipk + opkg feed index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ "${ref#v}" != "${ref}" ]; then
            version="${ref#v}"
          else
            version="0.0.0"
          fi
          if ! printf '%s' "${version}" | grep -Eq '^[0-9][0-9A-Za-z._~+-]*$'; then
            echo "::error::Ref '${ref}' cannot be used as a package version; tag as vX.Y.Z."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building version: ${version}"

      - name: Build package (OpenWrt 23.05.5)
        uses: ./.github/actions/build-package
        with:
          sdk_base_url: https://downloads.openwrt.org/releases/23.05.5/targets/x86/64
          sdk_pattern: openwrt-sdk-23.05.5-x86-64_.*Linux-x86_64\.tar\.(xz|zst)
          version: ${{ steps.version.outputs.version }}

      - name: Build opkg feed index
        run: |
          mkdir -p feed
          find sdk/bin/packages -type f -name 'luci-theme-c2_*.ipk' -exec cp -v {} feed/ \;
          if [ -z "$(ls -A feed)" ]; then
            echo "::error::No ipk produced."
            find sdk/bin/packages -maxdepth 3 -type f | sort
            exit 1
          fi
          cd feed
          mkhash_bin="../sdk/staging_dir/host/bin/mkhash"
          if [ ! -x "${mkhash_bin}" ]; then
            mkhash_bin="${PWD}/mkhash"
            cat > "${mkhash_bin}" <<'SH'
          #!/bin/sh
          algo="$1"; shift
          case "$algo" in
            sha256) sha256sum "$@" | awk '{print $1}' ;;
            md5) md5sum "$@" | awk '{print $1}' ;;
            *) echo "unsupported algo: $algo" >&2; exit 1 ;;
          esac
          SH
            chmod +x "${mkhash_bin}"
          fi
          MKHASH="${mkhash_bin}" bash ../sdk/scripts/ipkg-make-index.sh . > Packages
          gzip -9n -k Packages
          echo "--- feed contents ---"
          ls -l
          echo "--- Packages ---"
          cat Packages

      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipk-feed
          path: feed/*
          if-no-files-found: error

  build-apk:
    name: Build apk (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          version="${ref#v}"
          printf '%s' "${version}" | grep -Eq '^[0-9][0-9A-Za-z._~+-]*$' || version="0.0.0"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build package (snapshot)
        uses: ./.github/actions/build-package
        with:
          sdk_base_url: https://downloads.openwrt.org/snapshots/targets/x86/64
          sdk_pattern: openwrt-sdk-x86-64_.*Linux-x86_64\.tar\.zst
          version: ${{ steps.version.outputs.version }}

      - name: Collect apk
        run: |
          mkdir -p apk
          find sdk/bin/packages -type f -name 'luci-theme-c2-*.apk' -exec cp -v {} apk/ \;
          test -n "$(ls -A apk)"

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-package
          path: apk/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ipk, build-apk]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build-ipk.result == 'success' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true

      - name: List release assets
        run: ls -l release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
